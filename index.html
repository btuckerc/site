    <!-- Apply saved theme and font preference on <html> before paint to prevent flash without affecting #root hydration. -->
    <script>
      (function() {
        const themeColors = {
          dark: '#0f1115',
          light: '#e8eaed',
          amber: '#1d2021'
        };
        try {
          const savedTheme = localStorage.getItem('theme-mode');
          if (savedTheme === 'light' || savedTheme === 'amber') {
            document.documentElement.classList.add(savedTheme);
            const themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) themeMeta.setAttribute('content', themeColors[savedTheme]);
          }
        } catch {
          // Storage can be blocked in strict browser privacy settings.
        }

        const fonts = {
          'neue-montreal': "'PP Neue Montreal', 'Neue Montreal', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif",
          'obel-mono': "'Obel Mono', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace",
          'source-code': "'Source Code Pro Variable', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace",
          'ibm-plex': "'IBM Plex Mono', 'SF Mono', 'Menlo', 'Consolas', monospace",
          'geist-mono': "'Geist Mono Variable', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace",
          'martian-mono': "'Martian Mono Variable', 'SF Mono', 'Menlo', 'Consolas', monospace",
          'intel-one': "'Intel One Mono Variable', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace",
          'system': "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
        };
        const aliases = {
          jetbrains: 'geist-mono',
          'fira-code': 'martian-mono',
          montserrat: 'system',
          'pp-neue-montreal': 'neue-montreal'
        };
        const fontFiles = {
          'source-code': '/fonts/source-code-pro-latin-wght-normal.woff2',
          'obel-mono': '/fonts/obel-mono-1.000-wght-normal.woff2',
          'neue-montreal': 'https://pangrampangram.com/cdn/shop/files/PPNeueMontreal-Variable_b3ebe68c-91e0-4337-a3bc-c2a15b5e395b.woff2?v=1182376259239852185'
        };
        let savedFont = 'neue-montreal';
        try {
          savedFont = localStorage.getItem('font-family') || 'neue-montreal';
        } catch {
          // Storage can be blocked in strict browser privacy settings.
        }
        const fontId = aliases[savedFont] || savedFont;
        document.documentElement.style.setProperty('--font-family', fonts[fontId] || fonts['neue-montreal']);
        if (fontId !== savedFont && fonts[fontId]) {
          try {
            localStorage.setItem('font-family', fontId);
          } catch {
            // Ignore write failures when storage is unavailable.
          }
        }
        const fontHref = fontFiles[fontId];
        if (fontHref) {
          const preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'font';
          preload.type = 'font/woff2';
          preload.crossOrigin = 'anonymous';
          preload.href = fontHref;
          document.head.appendChild(preload);
        }
      })();
    </script>
