    <!-- Web fonts are self-hosted through the Vite CSS bundle. -->
    
    <!-- Load font preference immediately to prevent flash -->
    <script>
      (function() {
        const fonts = {
          'source-code': "'Source Code Pro Variable', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace",
          'ibm-plex': "'IBM Plex Mono', 'SF Mono', 'Menlo', 'Consolas', monospace",
          'geist-mono': "'Geist Mono Variable', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace",
          'martian-mono': "'Martian Mono Variable', 'SF Mono', 'Menlo', 'Consolas', monospace",
          'intel-one': "'Intel One Mono Variable', 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace",
          'system': "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif"
        };
        const aliases = {
          jetbrains: 'geist-mono',
          'fira-code': 'martian-mono',
          montserrat: 'system'
        };
        const fontFiles = {
          'source-code': '/fonts/source-code-pro-latin-wght-normal.woff2'
        };
        const savedFont = localStorage.getItem('font-family') || 'source-code';
        const fontId = aliases[savedFont] || savedFont;
        document.documentElement.style.setProperty('--font-family', fonts[fontId] || fonts['source-code']);
        if (fontId !== savedFont && fonts[fontId]) {
          localStorage.setItem('font-family', fontId);
        }
        const fontHref = fontFiles[fontId];
        if (fontHref) {
          const preload = document.createElement('link');
          preload.rel = 'preload';
          preload.as = 'font';
          preload.type = 'font/woff2';
          preload.crossOrigin = 'anonymous';
          preload.href = fontHref;
          document.head.appendChild(preload);
        }
      })();
    </script>
